upstream portfolio {
    server app:3000;
}

# Rate-limit login attempts at the edge ( complements in-app limiter )
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name rasyasmz.my.id;

    # Cloudflare Tunnel terminates TLS; traffic here is loopback-only.
    # Real client IP comes from the tunnel / X-Forwarded-For chain.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Next.js hashed assets — immutable, cache hard (browser + Cloudflare edge)
    location /_next/static/ {
        proxy_pass http://portfolio;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded media — cache briefly, revalidate often
    location ~* ^/(covers|badges|docs)/ {
        proxy_pass http://portfolio;
        add_header Cache-Control "public, max-age=86400";
    }

    # Throttle the login page (HTML + actions share the path)
    location = /admin/login {
        limit_req zone=login burst=8 nodelay;
        proxy_pass http://portfolio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://portfolio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
